name: Maison Samtpfote Demo veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - site.zip
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
      - name: Geprüfte Website entpacken
        run: |
          mkdir -p public
          unzip -q site.zip -d public
          test -f public/index.html
          test -f public/produkte/residenz/index.html
          touch public/.nojekyll
      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5
      - name: Website-Artefakt bereitstellen
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
